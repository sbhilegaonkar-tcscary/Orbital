<!DOCTYPE html>
<html lang="en" data-mode="bridge" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map / Zoom A — Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   TOKENS — every raw color in this file lives in the three blocks below.
   Below them: var() and color-mix() only.
   ====================================================================== */

:root {
  /* structural, colorless */
  --statusbar-h: 26px;
  --ease-fly: cubic-bezier(.32,.72,.24,1);
  --fly-ms: 800ms;
  --fade-ms: 600ms;
}

:root,
:root[data-mode="bridge"] {
  /* Mode: Bridge — skin Nebula Drift (styleguide/bridge/bridge-e-nebula-drift.html) */
  --bg: #090a17;
  --surface: #12142a;
  --surface-2: #1a1d3a;
  --border: #33366a;
  --text: #e8e9fb;
  --text-muted: #9497c4;
  --accent: #4fd8e8;
  --accent-2: #b98af0;
  --success: #4fe8a6;
  --warning: #f0c85a;
  --danger: #f2607e;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --font-display: 'Orbitron', 'Inter', sans-serif;
  --radius: 10px;
  --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 28px color-mix(in srgb, var(--accent-2) 22%, transparent);
  /* map-only raw colors */
  --band-today: #ffe0ab;
  --band-week:  #9ff0ff;
  --band-month: #4fd8e8;
  --band-half:  #8b7fd0;
  --band-old:   #4a4d7d;
  --star: #e8ecff;
  --shade: #04050d;
  --web: #7c81d4;
  --nebula-1: #5a33ad;
  --nebula-2: #1f86a8;
  --nebula-3: #922c74;
  /* derived layout */
  --topbar-h: 52px;
  --rail-w: 96px;
  --plaque-w: 268px;
  --panel: color-mix(in srgb, var(--surface) 74%, transparent);
}

:root[data-mode="paper"] {
  /* Mode: Paper — skin Clinical Terminal (styleguide/paper/paper-e-clinical-terminal.html) */
  --bg: #fafaf9;
  --surface: #ffffff;
  --surface-2: #f1f1ef;
  --border: #e1e1dd;
  --text: #17181a;
  --text-muted: #70757b;
  --accent: #0a5cff;
  --accent-2: #b3620d;
  --success: #1b8a5a;
  --warning: #b3620d;
  --danger: #c4202f;
  --font-ui: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --font-display: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --radius: 2px;
  --glow: none;
  /* map-only raw colors */
  --band-today: #b3620d;
  --band-week:  #0a5cff;
  --band-month: #4c6b9c;
  --band-half:  #767c85;
  --band-old:   #878d96;
  --star: #5b6068;
  --shade: #2b3038;
  --web: #a9adb6;
  --nebula-1: transparent;
  --nebula-2: transparent;
  --nebula-3: transparent;
  --topbar-h: 44px;
  --rail-w: 132px;
  --plaque-w: 268px;
  --panel: var(--surface);
}

/* ======================================================================
   SHELL — topbar / rail / statusbar copied from the two E mockups
   ====================================================================== */

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 13px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* --- bridge sky (hidden in paper) --- */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
:root[data-mode="paper"] .sky { display: none; }
.cloud { position: absolute; width: 70vw; height: 70vw; border-radius: 50%; opacity: .58; will-change: transform; }
.cloud.c1 { left: -22vw; top: -32vw; background: radial-gradient(closest-side, var(--nebula-1), transparent 68%); }
.cloud.c2 { right: -26vw; top: 4vw;  background: radial-gradient(closest-side, var(--nebula-2), transparent 68%); }
.cloud.c3 { left: 18vw; bottom: -46vw; background: radial-gradient(closest-side, var(--nebula-3), transparent 68%); }
.stars { position: absolute; inset: -10%; width: 1px; height: 1px; border-radius: 50%; }
.stars.far { opacity: .5; }
.stars.near { opacity: .85; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .cloud.c1 { animation: drift1 120s ease-in-out infinite alternate; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .cloud.c2 { animation: drift2 150s ease-in-out infinite alternate; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .cloud.c3 { animation: drift3 135s ease-in-out infinite alternate; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .stars.far  { animation: parallax 240s linear infinite; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .stars.near { animation: parallax 120s linear infinite; }
@keyframes drift1 { to { transform: translate(9vw, 6vw) rotate(12deg); } }
@keyframes drift2 { to { transform: translate(-8vw, 9vw) rotate(-10deg); } }
@keyframes drift3 { to { transform: translate(-10vw, -7vw) rotate(8deg); } }
@keyframes parallax { from { transform: translate3d(0,0,0); } to { transform: translate3d(-80px, 40px, 0); } }

/* --- app frame --- */
.app {
  position: relative; z-index: 1;
  height: 100%;
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr var(--statusbar-h);
  grid-template-areas:
    "topbar topbar"
    "rail   view"
    "status status";
}

/* --- topbar --- */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: 16px;
  padding: 0 18px;
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
:root[data-mode="paper"] .topbar { background: var(--surface); border-bottom-color: var(--border); backdrop-filter: none; -webkit-backdrop-filter: none; }
.logo {
  font: 600 13px/1 var(--font-display);
  letter-spacing: .24em;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
:root[data-mode="paper"] .logo { background: none; color: var(--text); letter-spacing: .18em; -webkit-text-fill-color: currentColor; }
:root[data-mode="paper"] .logo::before { content: "$ "; color: var(--accent-2); letter-spacing: 0; }
.project-name { font: 400 12.5px/1 var(--font-mono); color: var(--text-muted); white-space: nowrap; }
.project-name::before { content: "deck-4 / "; opacity: .7; }
:root[data-mode="paper"] .project-name::before { content: "~/deck-4/"; opacity: 1; }
.project-name b { color: var(--text); font-weight: 500; }

.skin-toggle {
  display: flex; align-items: center; gap: 2px;
  margin-left: 6px; padding: 2px;
  border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  border-radius: 999px;
}
:root[data-mode="paper"] .skin-toggle { border-radius: 2px; }
.skin-toggle button {
  font: 500 11px/1 var(--font-mono);
  padding: 5px 10px; border: 0; border-radius: 999px;
  background: transparent; color: var(--text-muted); cursor: pointer;
}
:root[data-mode="paper"] .skin-toggle button { border-radius: 2px; }
.skin-toggle button.active { color: var(--text); background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 24%, transparent); }
:root[data-mode="paper"] .skin-toggle button.active { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: none; }
.skin-toggle .sep { color: color-mix(in srgb, var(--text-muted) 60%, transparent); font: 400 11px/1 var(--font-mono); }

.mode-dial { margin-left: auto; display: flex; gap: 3px; }
.mode-dial span { padding: 5px 10px; border-radius: 999px; color: var(--text-muted); font-size: 11.5px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.mode-dial span.inert { opacity: .45; cursor: default; }
.mode-dial span.active {
  color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 30%, transparent);
}
:root[data-mode="paper"] .mode-dial span { border-radius: 0; border: 0; border-bottom: 2px solid transparent; text-transform: lowercase; padding: 4px 9px; }
:root[data-mode="paper"] .mode-dial span.active { background: none; box-shadow: none; border-bottom-color: var(--accent); }
.kernel-status { display: flex; align-items: center; gap: 8px; font: 400 11.5px/1 var(--font-mono); color: var(--text-muted); white-space: nowrap; }
.kernel-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }
:root[data-mode="paper"] .kernel-status i { box-shadow: none; }

/* --- rail --- */
.rail {
  grid-area: rail;
  padding: 16px 0;
  display: flex; flex-direction: column; gap: 4px;
  border-right: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
}
.rail-item {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 10px 0;
  color: var(--text-muted);
  font-size: 10.5px;
}
.rail-item.active { color: var(--text); }
.rail-item.active svg { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.rail-item.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
  background: linear-gradient(var(--accent), var(--accent-2));
  box-shadow: 0 0 10px var(--accent);
}
.rail svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
:root[data-mode="paper"] .rail { padding: 14px 0; gap: 2px; border-right-color: var(--border); }
:root[data-mode="paper"] .rail-item {
  display: grid; grid-template-columns: 18px 16px 1fr; align-items: center; gap: 8px;
  padding: 6px 12px 6px 10px; text-transform: lowercase; font-size: 12.5px;
}
:root[data-mode="paper"] .rail-item::before { content: "-"; color: var(--border); text-align: center; position: static; width: auto; background: none; box-shadow: none; }
:root[data-mode="paper"] .rail-item.active { background: var(--surface); }
:root[data-mode="paper"] .rail-item.active::before { content: ">"; color: var(--accent-2); }
:root[data-mode="paper"] .rail-item.active svg { color: var(--accent); filter: none; }
:root[data-mode="paper"] .rail svg { width: 16px; height: 16px; }

/* --- statusbar --- */
.statusbar {
  grid-area: status;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 18px;
  border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  color: var(--text-muted);
  font: 400 11px/1 var(--font-mono);
}
:root[data-mode="paper"] .statusbar { background: var(--surface-2); border-top-color: var(--border); }
.status-right { display: flex; align-items: center; gap: 14px; }
.chip {
  font: 400 10.5px/1 var(--font-mono);
  color: var(--text-muted);
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  border-radius: 999px; padding: 3px 9px; cursor: pointer;
}
:root[data-mode="paper"] .chip { border-radius: 2px; }
.chip:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }

/* ======================================================================
   MAP VIEW
   ====================================================================== */

.view { grid-area: view; display: grid; grid-template-columns: 1fr var(--plaque-w); min-width: 0; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }

.map-panel {
  background: var(--panel);
  border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  border-radius: var(--radius);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
:root[data-mode="paper"] .map-panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); }

/* breadcrumb + depth dots */
.map-head {
  position: absolute; left: 14px; top: 14px; z-index: 2;
  display: flex; align-items: center; gap: 14px;
  padding: 7px 12px;
}
.crumbs { display: flex; align-items: center; gap: 6px; font: 400 11.5px/1 var(--font-mono); }
.crumbs button {
  font: inherit; background: none; border: 0; padding: 2px 1px; cursor: pointer;
  color: var(--text-muted); border-bottom: 1px solid transparent;
}
.crumbs button:hover { color: var(--accent); border-bottom-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.crumbs button.here { color: var(--text); cursor: default; }
.crumbs button.here:hover { border-bottom-color: transparent; }
.crumbs .sl { color: color-mix(in srgb, var(--text-muted) 55%, transparent); }
.depth-dots { display: flex; align-items: center; gap: 5px; padding-left: 12px; border-left: 1px solid color-mix(in srgb, var(--border) 80%, transparent); }
.depth-dots i {
  width: 6px; height: 6px; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--text-muted) 70%, transparent);
  background: transparent;
}
.depth-dots i.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
:root[data-mode="paper"] .depth-dots i.on { box-shadow: none; }
.depth-dots i.fb { border-style: dashed; }
.depth-dots i.fb.on { background: transparent; border-color: var(--accent); }

/* plaque */
.plaque { margin: 14px 14px 14px 0; padding: 14px 15px; display: flex; flex-direction: column; gap: 0; overflow: hidden; }
.plaque-kicker { font: 500 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 9px; }
.plaque-name { font: 600 15px/1.25 var(--font-display); letter-spacing: .02em; word-break: break-word; margin-bottom: 3px; }
:root[data-mode="paper"] .plaque-name { font-weight: 600; font-size: 14px; letter-spacing: 0; }
.plaque-kind { font: 400 11px/1 var(--font-mono); color: var(--text-muted); margin-bottom: 12px; }
.plaque-rows { display: flex; flex-direction: column; }
.prow {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 6px 0;
  border-top: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
  font: 400 11.5px/1.35 var(--font-mono);
}
.prow:last-child { border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent); }
.prow .k { color: var(--text-muted); }
.prow .v { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
.band-chip { display: inline-flex; align-items: center; gap: 6px; }
.band-chip i { width: 8px; height: 8px; border-radius: 50%; }
.plaque-hint { margin-top: 12px; font: 400 10.5px/1.5 var(--font-mono); color: color-mix(in srgb, var(--text-muted) 80%, transparent); }
.plaque-acts { margin-top: auto; padding-top: 14px; display: flex; gap: 8px; }
.btn {
  flex: 1 1 0; padding: 8px 10px; cursor: pointer;
  font: 500 11.5px/1 var(--font-mono);
  border-radius: calc(var(--radius) - 3px);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--text);
}
.btn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 24%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 26%, transparent); }
:root[data-mode="paper"] .btn { border-radius: 2px; }
:root[data-mode="paper"] .btn:hover:not(:disabled) { box-shadow: none; }
.btn.secondary { border-color: color-mix(in srgb, var(--border) 90%, transparent); background: transparent; color: var(--text-muted); }
.btn.secondary:hover:not(:disabled) { color: var(--text); background: color-mix(in srgb, var(--surface-2) 70%, transparent); box-shadow: none; }
.btn:disabled { opacity: .35; cursor: default; }

/* ======================================================================
   SVG MAP — camera, layers, bodies
   ====================================================================== */

#camera { transform-box: view-box; transform-origin: 0px 0px; will-change: transform; }
:root:not([data-motion="reduced"]) #camera { transition: transform var(--fly-ms) var(--ease-fly); }
.layer { opacity: 0; pointer-events: none; }
:root:not([data-motion="reduced"]) .layer { transition: opacity var(--fade-ms) var(--ease-fly); }
.layer.live { opacity: 1; pointer-events: auto; }

.bb { fill: none; stroke: none; pointer-events: none; }
.hit { fill: color-mix(in srgb, var(--accent) 0%, transparent); pointer-events: all; }

/* shared text */
.lbl { paint-order: stroke; stroke: var(--bg); stroke-width: 3.4px; stroke-opacity: .72; stroke-linejoin: round; }
.t-name { font: 600 13px/1 var(--font-display); letter-spacing: .04em; fill: var(--text); }
.t-cap  { font: 400 10px/1 var(--font-mono); fill: var(--text-muted); }
.t-body { font: 400 11px/1 var(--font-mono); fill: color-mix(in srgb, var(--text) 78%, var(--text-muted)); }
.t-dir  { font: 500 11.5px/1 var(--font-mono); fill: var(--text); }
.t-ring { font: 400 9px/1 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; fill: color-mix(in srgb, var(--text-muted) 62%, transparent); }
.t-note { font: 400 9.5px/1 var(--font-mono); letter-spacing: .1em; fill: color-mix(in srgb, var(--text-muted) 75%, transparent); }

/* rings */
.ring { fill: none; stroke: color-mix(in srgb, var(--border) 85%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ring.alt { stroke-dasharray: 3 6; stroke: color-mix(in srgb, var(--border) 60%, transparent); }
.ring.rim { stroke: color-mix(in srgb, var(--border) 45%, transparent); stroke-dasharray: 1 7; }

/* bodies */
.body { cursor: pointer; }
.body[data-enter="0"] { cursor: default; }
.hoverring { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: 0; vector-effect: non-scaling-stroke; }
:root:not([data-motion="reduced"]) .hoverring { transition: opacity 160ms linear; }
.body:hover .hoverring { opacity: 1; }
.body:hover .t-name, .body:hover .t-dir, .body:hover .t-body { fill: var(--text); }
.body:hover .gx-halo { opacity: 1; }
.body:hover .nb-glow { opacity: .55; }

/* galaxies */
.gx-halo { opacity: .72; }
:root:not([data-motion="reduced"]) .gx-halo { transition: opacity 200ms linear; }
.gx-core { fill: var(--star); opacity: .5; }
.gx-stars circle { shape-rendering: geometricPrecision; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .spin { animation: spin var(--dur, 360s) linear infinite; }
.spin { transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinrev { to { transform: rotate(-360deg); } }

/* cosmic web */
.web { fill: none; stroke: var(--web); stroke-width: 1; opacity: .28; vector-effect: non-scaling-stroke; }

/* loose field */
.loose-hull { fill: none; stroke: color-mix(in srgb, var(--border) 70%, transparent); stroke-dasharray: 2 5; }

/* planets */
.pl-band { opacity: .22; fill: var(--shade); }
.pl-band.light { fill: var(--star); opacity: .14; }
.pl-rim { fill: none; stroke: var(--star); stroke-opacity: .28; stroke-width: 1; vector-effect: non-scaling-stroke; }
.pl-ring { fill: none; stroke-width: 1.4; opacity: .5; vector-effect: non-scaling-stroke; }
.pl-shade { pointer-events: none; }

/* notebooks + files */
.nb-disc { stroke: var(--star); stroke-opacity: .35; stroke-width: .8; vector-effect: non-scaling-stroke; }
.nb-glow { opacity: .3; }
:root:not([data-motion="reduced"]) .nb-glow { transition: opacity 200ms linear; }
.ast { stroke: var(--shade); stroke-opacity: .35; stroke-width: .7; vector-effect: non-scaling-stroke; }
:root[data-mode="paper"] .ast { stroke-opacity: .18; }

/* outposts */
.outpost-body { stroke: var(--accent); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.outpost-halo { fill: none; stroke: var(--accent); stroke-opacity: .4; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }

/* moon orbit motion, bridge only */
.orbitring, .counter { transform-box: fill-box; transform-origin: 50% 50%; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .orbitring { animation: spin var(--dur, 200s) linear infinite; }
:root[data-mode="bridge"]:not([data-motion="reduced"]) .counter { animation: spinrev var(--dur, 200s) linear infinite; }

/* depth 4 fallback — deliberately plainer */
.plain .fb-dot { fill: var(--accent); }
.plain .fb-file { fill: color-mix(in srgb, var(--text-muted) 85%, transparent); }
.plain .fb-dir { fill: none; stroke: var(--accent-2); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.plain .t-body { font-size: 10px; fill: var(--text-muted); }
.plain .lbl { stroke-opacity: .55; }
.plain .fb-core { fill: none; stroke: var(--text-muted); stroke-width: 1; vector-effect: non-scaling-stroke; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="stars far" id="stars-far"></div>
  <div class="stars near" id="stars-near"></div>
</div>

<div class="app">
  <header class="topbar">
    <span class="logo">ORBITAL</span>
    <span class="project-name"><b>hull-stress-analysis</b></span>
    <div class="skin-toggle" id="skin-toggle">

  return '<path class="ast" d="' + asteroidPath(r, rngFor(seed)) + '" transform="translate(' + f1(x) + ' ' + f1(y) +
    ')" style="fill:var(--band-' + band + ')"/>';
}

/* ==================================================================
   4. DEPTH 1 — galaxies
   ================================================================== */
var GAL_AT = {
  'experiments':        { x: 238, y: 232 },
  'data':               { x: 782, y: 205 },
  'rigs':               { x: 828, y: 500 },
  'archive':            { x: 250, y: 570 },
  '.ipynb_checkpoints': { x: 588, y: 620 }
};
var LOOSE = { x: CX, y: CY, rx: 82, ry: 52 };

function looseDots() {
  var rnd = rngFor('loose-field'), out = [];
  ROOT.forEach(function (n) {
    if (n.kind === 'directory') return;
    var a = rnd() * TAU, t = Math.sqrt(rnd());
    out.push({ node: n, x: LOOSE.x + Math.cos(a) * LOOSE.rx * t, y: LOOSE.y + Math.sin(a) * LOOSE.ry * t, band: bandOf(n.age) });
  });
  return out;
}

function renderGalaxies() {
  var defs = [], s = '', dots = looseDots();

  /* --- cosmic web: hairlines between top-level nodes in the same band --- */
  var nodes = [];
  Object.keys(GAL_AT).forEach(function (p) {
    nodes.push({ x: GAL_AT[p].x, y: GAL_AT[p].y, band: bandOf(byPath[p].age) });
  });
  var perBand = {};
  dots.forEach(function (d) { (perBand[d.band] = perBand[d.band] || []).push(d); });
  BAND_IDS.forEach(function (b) {
    var list = (perBand[b] || []).slice().sort(function (p, q) { return p.node.age - q.node.age; }).slice(0, 2);
    nodes.forEach(function (n) { if (n.band === b) list.push(n); });
    if (list.length < 2) return;
    list.sort(function (p, q) { return Math.atan2(p.y - CY, p.x - CX) - Math.atan2(q.y - CY, q.x - CX); });
    for (var i = 0; i < list.length; i++) {
      var a = list[i], c = list[(i + 1) % list.length];
      if (list.length === 2 && i === 1) break;
      var mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
      var nx = -(c.y - a.y), ny = (c.x - a.x), len = Math.hypot(nx, ny) || 1;
      s += '<path class="web" d="M' + f1(a.x) + ',' + f1(a.y) + 'Q' + f1(mx + nx / len * 26) + ',' +
        f1(my + ny / len * 26) + ' ' + f1(c.x) + ',' + f1(c.y) + '"/>';
    }
  });

  /* --- loose local field --- */
  s += '<g class="body" data-path="__loose" data-kind="field" data-fx="' + LOOSE.x + '" data-fy="' + LOOSE.y + '" data-enter="0">';
  s += '<ellipse class="hit" cx="' + LOOSE.x + '" cy="' + LOOSE.y + '" rx="' + (LOOSE.rx + 14) + '" ry="' + (LOOSE.ry + 14) + '"/>';
  s += '<ellipse class="loose-hull" cx="' + LOOSE.x + '" cy="' + LOOSE.y + '" rx="' + (LOOSE.rx + 10) + '" ry="' + (LOOSE.ry + 10) + '"/>';
  dots.forEach(function (d) {
    var r = d.node.kind === 'notebook' ? 3.4 : 2.3;
    s += '<circle class="loose-dot" cx="' + f1(d.x) + '" cy="' + f1(d.y) + '" r="' + r +
      '" opacity="' + BAND_DIM[d.band] + '" style="fill:var(--band-' + d.band + ')"/>';
  });
  s += '<ellipse class="hoverring" cx="' + LOOSE.x + '" cy="' + LOOSE.y + '" rx="' + (LOOSE.rx + 18) + '" ry="' + (LOOSE.ry + 18) + '"/>';
  s += '<text class="lbl t-cap" x="' + LOOSE.x + '" y="' + (LOOSE.y + LOOSE.ry + 28) + '" text-anchor="middle">loose files</text>';
  s += '<text class="lbl t-cap" x="' + LOOSE.x + '" y="' + (LOOSE.y + LOOSE.ry + 43) + '" text-anchor="middle" opacity=".7">' +
    dots.length + ' items · changed ' + agoText(1 * HOUR) + '</text>';
  s += '</g>';

  /* --- the galaxies --- */
  Object.keys(GAL_AT).forEach(function (p) {
    var node = byPath[p], at = GAL_AT[p], rnd = rngFor(p);
    var desc = descendants(p);
    var R = clamp(26 + Math.sqrt(desc) * 7, 34, 92);
    var N = Math.round(clamp(30 + desc * 1.5, 34, 150));
    var band = bandOf(node.age);
    var tilt = (rnd() - .5) * 70;
    var squash = .44 + rnd() * .3;
    var arms = rnd() > .45 ? 2 : 3;
    var stars = '';
    for (var i = 0; i < N; i++) {
      var t = Math.pow((i + .6) / N, .55);
      var a = (i % arms) * (TAU / arms) + t * 2.35 * Math.PI + (rnd() - .5) * (.5 + (1 - t));
      var rr = R * (.08 + .92 * t) * (1 + (rnd() - .5) * .2);
      stars += '<circle cx="' + f1(Math.cos(a) * rr) + '" cy="' + f1(Math.sin(a) * rr) +
        '" r="' + f2(clamp((.5 + rnd() * 1.2) * (1 - t * .3), .35, 1.8)) +
        '" opacity="' + f2(clamp((.62 + rnd() * .38) * (1 - t * .22), .38, 1)) + '"/>';
    }

    s += bodyOpen(node, at.x, at.y, true);
    s += '<g transform="translate(' + at.x + ' ' + at.y + ')" opacity="' + BAND_DIM[band] + '">';
    s += '<circle class="hit" r="' + f1(R + 8) + '"/>';
    s += '<g transform="rotate(' + f1(tilt) + ') scale(1 ' + f2(squash) + ')">';
    s += '<circle class="gx-halo" r="' + f1(R * .98) + '" fill="url(#halo-' + band + ')"/>';
    s += '<g class="spin" style="--dur:360s">';
    s += '<rect class="bb" x="' + f1(-R - 4) + '" y="' + f1(-R - 4) + '" width="' + f1(2 * R + 8) + '" height="' + f1(2 * R + 8) + '"/>';
    s += '<g class="gx-stars" style="fill:var(--band-' + band + ')">' + stars + '</g>';
    s += '<ellipse class="gx-core" rx="' + f1(R * .19) + '" ry="' + f1(R * .13) + '"/>';
    s += '</g></g>';
    s += '<circle class="hoverring" r="' + f1(R + 13) + '"/>';
    s += '</g>';
    s += '<text class="lbl t-name" x="' + at.x + '" y="' + f1(at.y + R + 25) + '" text-anchor="middle">' + esc(node.name) + '</text>';
    s += '<text class="lbl t-cap" x="' + at.x + '" y="' + f1(at.y + R + 41) + '" text-anchor="middle">' +
      desc + ' items · changed ' + agoText(node.age) + '</text>';
    s += '</g>';
  });

  return '<defs>' + defs.join('') + '</defs>' + s;
}

/* ==================================================================
   5. DEPTH 2 — a system: planets, bright bodies, asteroids
   ================================================================== */
var SYS_R = [124, 188, 248, 302, 350];

function renderSystem(dir) {
  var defs = [], s = '', node = byPath[dir], kids = (tree[dir] || []).slice();
  var lid = 'sys' + (++uid), P = new Placer();

  defs.push(BAND_IDS.map(function (b, i) {
    return '<path id="' + lid + '-r' + i + '" d="' + ringCaptionPath(CX, CY, SYS_R[i]) + '"/>';
  }).join(''));
  s += '<g aria-hidden="true">';
  BAND_IDS.forEach(function (b, i) {
    s += '<circle class="ring' + (i % 2 ? ' alt' : '') + '" cx="' + CX + '" cy="' + CY + '" r="' + SYS_R[i] + '"/>';
    s += '<text class="t-ring"><textPath href="#' + lid + '-r' + i + '" startOffset="6">' + bandLabel(b) + '</textPath></text>';
  });
  s += '</g>';

  /* the folder itself is the local star */
  s += '<g class="local-star">';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="64" fill="url(#starglow)"/>';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="21" style="fill:var(--star)" opacity=".92"/>';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="30" class="pl-rim" opacity=".6"/>';
  s += '</g>';
  var cap = kids.length + ' items \u00b7 changed ' + agoText(node.age);
  s += '<text class="lbl t-name" x="' + CX + '" y="' + (CY + 88) + '" text-anchor="middle" font-size="15">' + esc(node.name) + '</text>';
  s += '<text class="lbl t-cap" x="' + CX + '" y="' + (CY + 105) + '" text-anchor="middle">' + cap + '</text>';
  P.blockDisc(CX, CY, 66);
  P.block(CX - node.name.length * 5.5, CY + 74, CX + node.name.length * 5.5, CY + 93);
  P.block(CX - cap.length * 3.4, CY + 94, CX + cap.length * 3.4, CY + 112);

  /* pass 1: put every body down and reserve its disc */
  var spots = [];
  BAND_IDS.forEach(function (b, i) {
    var inBand = kids.filter(function (c) { return bandOf(c.age) === b; });
    if (!inBand.length) return;
    var angs = ringAngles(inBand.length, dir + '|' + b);
    inBand.forEach(function (c, j) {
      var isDir = c.kind === 'directory';
      var r = isDir ? clamp(14 + Math.sqrt(c.childCount || 1) * 3.2, 16, 36)
        : c.kind === 'notebook' ? 7 + sizeFactor(c) * 4 : 3.6 + sizeFactor(c) * 2.6;
      var sp = {
        c: c, b: b, isDir: isDir, r: r, gap: (isDir ? r * 1.8 : r) + 11,
        x: CX + Math.cos(angs[j]) * SYS_R[i], y: CY + Math.sin(angs[j]) * SYS_R[i]
      };
      spots.push(sp);
      P.blockDisc(sp.x, sp.y, isDir ? r * 1.78 : r + 4);
    });
  });

  /* pass 2: draw, then hang a de-collided label off each body */
  spots.forEach(function (sp) {
    var c = sp.c, x = sp.x, y = sp.y, r = sp.r;
    s += bodyOpen(c, x, y, sp.isDir);
    s += '<circle class="hit" cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1(r + 9) + '"/>';
    s += '<g opacity="' + BAND_DIM[sp.b] + '">';
    if (sp.isDir) s += planet(x, y, r, sp.b, c.path, defs);
    else if (c.kind === 'notebook') s += brightBody(x, y, r, sp.b);
    else s += asteroid(x, y, r, sp.b, c.path);
    s += '</g>';
    s += '<circle class="hoverring" cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1((sp.isDir ? r * 1.8 : r) + 10) + '"/>';
    s += P.place(x, y, sp.gap, c.name, sp.isDir ? 't-dir' : 't-body', sp.isDir);
    s += '</g>';
  });

  return '<defs>' + defs.join('') + '</defs>' + s;
}

/* ==================================================================
   6. DEPTH 3 - moons around one planet
   ================================================================== */
var MOON_R = [148, 200, 250, 296, 338];
var MOON_DUR = ['150s', '186s', '228s', '282s', '336s'];
var OUTPOST_R = 368;

function renderMoons(dir) {
  var defs = [], s = '', node = byPath[dir], kids = (tree[dir] || []).slice();
  var band = bandOf(node.age), P = new Placer();

  s += '<g aria-hidden="true">';
  MOON_R.forEach(function (r, i) {
    s += '<circle class="ring' + (i % 2 ? ' alt' : '') + '" cx="' + CX + '" cy="' + CY + '" r="' + r + '"/>';
  });
  s += '<circle class="ring rim" cx="' + CX + '" cy="' + CY + '" r="' + OUTPOST_R + '"/>';
  s += '</g>';

  s += '<g class="host">' + planet(CX, CY, 92, band, dir + '#host', defs) + '</g>';
  var cap = kids.length + ' items \u00b7 changed ' + agoText(node.age);
  s += '<text class="lbl t-name" x="' + CX + '" y="' + (CY + 4) + '" text-anchor="middle" font-size="17">' + esc(node.name) + '</text>';
  s += '<text class="lbl t-cap" x="' + CX + '" y="' + (CY + 22) + '" text-anchor="middle">' + cap + '</text>';
  P.block(CX - 162, CY - 96, CX + 162, CY + 96);

  /* pass 1 */
  var spots = [], subs = [];
  BAND_IDS.forEach(function (b, i) {
    var inBand = kids.filter(function (c) { return c.kind !== 'directory' && bandOf(c.age) === b; });
    if (!inBand.length) return;
    var angs = ringAngles(inBand.length, dir + '|moon|' + b);
    var every = Math.max(1, Math.round(inBand.length / Math.min(5, inBand.length)));
    inBand.forEach(function (c, j) {
      var isNb = c.kind === 'notebook';
      var r = isNb ? 5.5 + sizeFactor(c) * 3 : 3.2 + sizeFactor(c) * 2.4;
      var sp = {
        c: c, b: b, ring: i, isNb: isNb, r: r, wants: j % every === 0,
        x: CX + Math.cos(angs[j]) * MOON_R[i], y: CY + Math.sin(angs[j]) * MOON_R[i]
      };
      spots.push(sp);
      P.blockDisc(sp.x, sp.y, r + 4);
    });
  });
  var dirKids = kids.filter(function (c) { return c.kind === 'directory'; });
  if (dirKids.length) {
    var oa = ringAngles(dirKids.length, dir + '|outposts');
    dirKids.forEach(function (c, j) {
      var sp = { c: c, x: CX + Math.cos(oa[j]) * OUTPOST_R, y: CY + Math.sin(oa[j]) * OUTPOST_R };
      subs.push(sp);
      P.blockDisc(sp.x, sp.y, 16);
    });
  }
  /* outposts are the navigable things at this depth, so they claim labels first */
  subs.forEach(function (sp) { sp.label = P.place(sp.x, sp.y, 20, sp.c.name + '  \u203a', 't-dir', true); });

  /* pass 2 */
  var byRing = {};
  spots.forEach(function (sp) { (byRing[sp.ring] = byRing[sp.ring] || []).push(sp); });
  Object.keys(byRing).forEach(function (i) {
    s += '<g class="orbitring" style="--dur:' + MOON_DUR[i] + '">';
    s += '<rect class="bb" x="' + (CX - 580) + '" y="' + (CY - 580) + '" width="1160" height="1160"/>';
    byRing[i].forEach(function (sp) {
      var c = sp.c, x = sp.x, y = sp.y, r = sp.r;
      s += bodyOpen(c, x, y, false);
      s += '<circle class="hit" cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1(r + 9) + '"/>';
      s += '<g opacity="' + BAND_DIM[sp.b] + '">' + (sp.isNb ? brightBody(x, y, r, sp.b) : asteroid(x, y, r, sp.b, c.path)) + '</g>';
      s += '<circle class="hoverring" cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1(r + 9) + '"/>';
      var lab = sp.wants ? P.place(x, y, r + 11, c.name, 't-body', false) : '';
      if (lab) {
        var hb = Math.max(170, c.name.length * 6.6 + 44);
        s += '<g class="counter" style="--dur:' + MOON_DUR[i] + '">';
        s += '<rect class="bb" x="' + f1(x - hb) + '" y="' + f1(y - hb) + '" width="' + f1(hb * 2) + '" height="' + f1(hb * 2) + '"/>';
        s += lab + '</g>';
      }
      s += '</g>';
    });
    s += '</g>';
  });

  if (subs.length) {
    s += '<g class="orbitring" style="--dur:420s">';
    s += '<rect class="bb" x="' + (CX - 580) + '" y="' + (CY - 580) + '" width="1160" height="1160"/>';
    subs.forEach(function (sp) {
      var c = sp.c, x = sp.x, y = sp.y, cb = bandOf(c.age), hex = [];
      for (var v = 0; v < 6; v++) hex.push(f1(x + Math.cos(v / 6 * TAU) * 9) + ',' + f1(y + Math.sin(v / 6 * TAU) * 9));
      s += bodyOpen(c, x, y, true);
      s += '<circle class="hit" cx="' + f1(x) + '" cy="' + f1(y) + '" r="18"/>';
      s += '<circle class="outpost-halo" cx="' + f1(x) + '" cy="' + f1(y) + '" r="15"/>';
      s += '<path class="outpost-body" d="M' + hex.join('L') + 'Z" style="fill:var(--band-' + cb + ')"/>';
      s += '<circle class="hoverring" cx="' + f1(x) + '" cy="' + f1(y) + '" r="21"/>';
      var ob = Math.max(170, c.name.length * 6.6 + 54);
      s += '<g class="counter" style="--dur:420s">';
      s += '<rect class="bb" x="' + f1(x - ob) + '" y="' + f1(y - ob) + '" width="' + f1(ob * 2) + '" height="' + f1(ob * 2) + '"/>';
      s += sp.label + '</g></g>';
    });
    s += '</g>';
  }

  return '<defs>' + defs.join('') + '</defs>' + s;
}

var FB_R = [110, 175, 238, 296, 344];

      var sp = { c: c, b: b, isDir: c.kind === 'directory',
        x: CX + Math.cos(angs[j]) * FB_R[i], y: CY + Math.sin(angs[j]) * FB_R[i] };
      spots.push(sp);
      P.blockDisc(sp.x, sp.y, 7);
    });
  });

    if (sp.isDir) s += '<circle class="fb-dir" cx="' + f1(x) + '" cy="' + f1(y) + '" r="5"/>';
    else if (c.kind === 'notebook') s += '<circle class="fb-dot" cx="' + f1(x) + '" cy="' + f1(y) + '" r="4.2" opacity="' + BAND_DIM[sp.b] + '"/>';
    else s += '<circle class="fb-file" cx="' + f1(x) + '" cy="' + f1(y) + '" r="2.8" opacity="' + BAND_DIM[sp.b] + '"/>';
    s += '<circle class="hoverring" cx="' + f1(x) + '" cy="' + f1(y) + '" r="10"/>';
    s += P.place(x, y, 12, c.name, 't-body', sp.isDir);
    s += '</g>';
  });

  return '<g class="plain"><defs>' + defs.join('') + '</defs>' + s + '</g>';
}

function renderLevel(path) {
  var d = path === '' ? 1 : path.split('/').length + 1;
  if (d === 1) return renderGalaxies();
  if (d === 2) return renderSystem(path);
  if (d === 3) return renderMoons(path);
  return renderFallback(path);
}

/* ==================================================================
   8. camera — one <g> whose transform interpolates
   ================================================================== */
var root = document.documentElement;
var svg = document.getElementById('map');
var camera = document.getElementById('camera');
var layers = [document.getElementById('layerA'), document.getElementById('layerB')];
var cur = 0;
var curPath = '';
var busy = false;
var focusAt = {};          /* depth -> {x,y} of the body we descended through */
var K_BASE = 5.5;

function depthOf(p) { return p === '' ? 1 : p.split('/').length + 1; }
function reduced() { return root.getAttribute('data-motion') === 'reduced'; }

/* camera at scale k about (fx,fy): p -> k*p + f*(1-k) */
function camAbout(k, fx, fy) {
  return 'translate(' + f2(fx * (1 - k)) + 'px, ' + f2(fy * (1 - k)) + 'px) scale(' + f2(k) + ')';
}
/* the nesting matrix M with camAbout(k,f) . M = identity */
function nestIn(k, fx, fy) {
  return 'translate(' + f2(fx * (1 - 1 / k)) + ' ' + f2(fy * (1 - 1 / k)) + ') scale(' + f2(1 / k) + ')';
}
function reflow(el) { void el.getBoundingClientRect(); }

function goTo(nextPath, focus) {
  if (busy || nextPath === curPath) return;
  var from = depthOf(curPath), to = depthOf(nextPath);
  var dir = to > from ? 'in' : 'out';
  var k = Math.pow(K_BASE, Math.min(Math.abs(to - from), 2));
  var f = focus || focusAt[dir === 'in' ? from : to] || { x: CX, y: CY };
  if (dir === 'in') focusAt[from] = f;

  pinned = null;
  var a = layers[cur], b = layers[1 - cur];
  b.innerHTML = renderLevel(nextPath);

  if (reduced()) {
    camera.style.transform = '';
    a.setAttribute('transform', ''); b.setAttribute('transform', '');
    a.classList.remove('live'); b.classList.add('live');
    a.innerHTML = '';
    cur = 1 - cur; curPath = nextPath; syncChrome();
    return;
  }

  busy = true;
  if (dir === 'in') {
    a.setAttribute('transform', '');
    b.setAttribute('transform', nestIn(k, f.x, f.y));
    camera.style.transition = 'none';
    camera.style.transform = 'none';
    reflow(camera);
    camera.style.transition = '';
    camera.style.transform = camAbout(k, f.x, f.y);
  } else {
    b.setAttribute('transform', '');
    a.setAttribute('transform', nestIn(k, f.x, f.y));
    camera.style.transition = 'none';
    camera.style.transform = camAbout(k, f.x, f.y);
    reflow(camera);
    camera.style.transition = '';
    camera.style.transform = 'none';
  }
  a.classList.remove('live');
  b.classList.add('live');

  cur = 1 - cur; curPath = nextPath; syncChrome();

  window.setTimeout(function () {
    /* rebase: the arriving level becomes the new identity frame. Because
       camera . nest == identity this is pixel-identical, so nothing jumps. */
    camera.style.transition = 'none';
    camera.style.transform = 'none';
    layers[0].setAttribute('transform', '');
    layers[1].setAttribute('transform', '');
    layers[1 - cur].innerHTML = '';
    reflow(camera);
    camera.style.transition = '';
    busy = false;
  }, 840);
}

/* ==================================================================
   9. chrome: breadcrumb, depth dots, plaque, statusbar
   ================================================================== */
var crumbsEl = document.getElementById('crumbs');
var dotsEl = document.getElementById('dots');
var plaqueEl = document.getElementById('plaque');
var statusEl = document.getElementById('status-left');
var pinned = null;

function syncChrome() {
  var segs = curPath === '' ? [] : curPath.split('/');
  var html = '', acc = '';
  html += '<button type="button" data-goto="" class="' + (segs.length ? '' : 'here') + '">workspace</button>';
  segs.forEach(function (sg, i) {
    acc = acc ? acc + '/' + sg : sg;
    html += '<span class="sl">›</span><button type="button" data-goto="' + esc(acc) + '" class="' +
      (i === segs.length - 1 ? 'here' : '') + '">' + esc(sg) + '</button>';
  });
  crumbsEl.innerHTML = html;

  var d = depthOf(curPath);
  Array.prototype.forEach.call(dotsEl.children, function (dot, i) {
    dot.classList.toggle('on', i < Math.min(d, 4));
  });

  var kids = tree[curPath] || [];
  statusEl.textContent = 'depth ' + d + ' · ' + (byPath[curPath] ? byPath[curPath].name : curPath) +
    ' · ' + kids.length + ' bodies' + (d >= 4 ? ' · chart fallback' : '');

  if (!pinned) showPlaque(null);
}

function plaqueFor(target) {
  var n, kicker, rows = [], hint = '', enterable = false;

  if (target === '__loose') {
    var dots = looseDots();
    n = { name: 'loose files', kind: 'field', age: 1 * HOUR };
    kicker = 'local field';
    rows.push(['items', dots.length]);
    rows.push(['notebooks', dots.filter(function (d) { return d.node.kind === 'notebook'; }).length]);
    rows.push(['files', dots.filter(function (d) { return d.node.kind === 'file'; }).length]);
    rows.push(['last change', agoText(1 * HOUR)]);
    hint = 'root-level notebooks and files — not a folder, nothing to enter';
  } else {
    n = byPath[target];
    if (!n) return '';
    kicker = n.kind === 'directory' ? (depthOf(n.path) === 2 ? 'galaxy' : depthOf(n.path) === 3 ? 'planet' : 'outpost')
      : n.kind === 'notebook' ? 'notebook' : 'file';
    if (n.kind === 'directory') {
      var t = tally(n.path);
      enterable = true;
      rows.push(['items', (n.childCount !== undefined ? n.childCount : (tree[n.path] || []).length)]);
      rows.push(['notebooks', t.nb]);
      rows.push(['files', t.file]);
      rows.push(['folders', t.dir]);
      rows.push(['descendants', descendants(n.path)]);
    } else {
      rows.push(['size', sizeText(n.bytes)]);
      rows.push(['path', n.path.length > 26 ? '…' + n.path.slice(-25) : n.path]);
    }
    rows.push(['last change', agoText(n.age)]);
    hint = enterable ? (depthOf(n.path) >= 4 ? 'enter — renders as the flat chart' : 'click the body, or press Enter below')
      : 'leaf body — open it in the notebook view';
  }

  var band = bandOf(n.age);
  var s = '<div class="plaque-kicker">' + kicker + '</div>';
  s += '<div class="plaque-name">' + esc(n.name) + '</div>';
  s += '<div class="plaque-kind">' + (n.kind === 'field' ? 'local field' : n.kind) + '</div>';
  s += '<div class="plaque-rows">';
  rows.forEach(function (r) { s += '<div class="prow"><span class="k">' + r[0] + '</span><span class="v">' + esc(r[1]) + '</span></div>'; });
  s += '<div class="prow"><span class="k">band</span><span class="v band-chip"><i style="background:var(--band-' + band + ')"></i>' + bandLabel(band) + '</span></div>';
  s += '</div>';
  s += '<div class="plaque-hint">' + hint + '</div>';
  s += '<div class="plaque-acts">';
  s += '<button type="button" class="btn secondary" data-act="open" data-target="' + esc(target) + '">Open</button>';
  s += '<button type="button" class="btn" data-act="enter" data-target="' + esc(target) + '"' + (enterable ? '' : ' disabled') + '>Enter</button>';
  s += '</div>';
  return s;
}

function showPlaque(target) {
  if (target) { plaqueEl.innerHTML = plaqueFor(target); return; }
  var n = byPath[curPath], t = tally(curPath), d = depthOf(curPath);
  var s = '<div class="plaque-kicker">' + (d === 1 ? 'galaxy map' : d === 2 ? 'system' : d === 3 ? 'moon system' : 'chart') + '</div>';
  s += '<div class="plaque-name">' + esc(n.name) + '</div>';
  s += '<div class="plaque-kind">current level · depth ' + d + '</div>';
  s += '<div class="plaque-rows">';
  s += '<div class="prow"><span class="k">bodies here</span><span class="v">' + (tree[curPath] || []).length + '</span></div>';
  s += '<div class="prow"><span class="k">notebooks</span><span class="v">' + t.nb + '</span></div>';
  s += '<div class="prow"><span class="k">files</span><span class="v">' + t.file + '</span></div>';
  s += '<div class="prow"><span class="k">folders</span><span class="v">' + t.dir + '</span></div>';
  s += '<div class="prow"><span class="k">descendants</span><span class="v">' + descendants(curPath) + '</span></div>';
  s += '</div>';
  s += '<div class="plaque-hint">hover a body for its plaque · click a folder to fly in · Esc or empty space to fly out</div>';
  s += '<div class="plaque-acts">';
  s += '<button type="button" class="btn secondary" disabled>Open</button>';
  s += '<button type="button" class="btn" disabled>Enter</button>';
  s += '</div>';
  plaqueEl.innerHTML = s;
}

var flashTimer = 0;
function flash(msg) {
  statusEl.textContent = msg;
  window.clearTimeout(flashTimer);
  flashTimer = window.setTimeout(function () {
    var keep = pinned; syncChrome(); if (keep) showPlaque(keep);
  }, 2200);
}

/* ==================================================================
   10. interaction
   ================================================================== */
svg.addEventListener('mouseover', function (e) {
  var g = e.target.closest ? e.target.closest('.body') : null;
  if (!g || !g.parentNode || !g.closest('.layer').classList.contains('live')) return;
  pinned = g.getAttribute('data-path');
  showPlaque(pinned);
});
svg.addEventListener('mouseout', function (e) {
  var g = e.target.closest ? e.target.closest('.body') : null;
  if (!g) return;
  if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.body') === g) return;
  pinned = null;
  showPlaque(null);
});
svg.addEventListener('click', function (e) {
  if (busy) return;
  var g = e.target.closest ? e.target.closest('.body') : null;
  if (g && g.closest('.layer').classList.contains('live')) {
    if (g.getAttribute('data-enter') !== '1') { flash('leaf body · ' + g.getAttribute('data-path')); return; }
    goTo(g.getAttribute('data-path'), { x: +g.getAttribute('data-fx'), y: +g.getAttribute('data-fy') });
  } else {
    up();
  }
});

function up() {
  if (curPath === '') return;
  var parts = curPath.split('/'); parts.pop();
  goTo(parts.join('/'), null);
}

crumbsEl.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-goto]');
  if (!b) return;
  goTo(b.getAttribute('data-goto'), null);
});

plaqueEl.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  var target = b.getAttribute('data-target');
  if (b.getAttribute('data-act') === 'open') {
    flash('open ' + (target === '__loose' ? 'loose files' : target) + ' · (mockup)');
  } else {
    var host = svg.querySelector('.layer.live .body[data-path="' + target.replace(/"/g, '\\"') + '"]');
    goTo(target, host ? { x: +host.getAttribute('data-fx'), y: +host.getAttribute('data-fy') } : null);
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); up(); }
});

/* skin + motion toggles */
function setSkin(skin) {
  root.setAttribute('data-mode', skin);
  Array.prototype.forEach.call(document.querySelectorAll('#skin-toggle button'), function (b) {
    b.classList.toggle('active', b.getAttribute('data-skin') === skin);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#mode-dial span'), function (sp) {
    sp.classList.toggle('active', sp.getAttribute('data-skin') === skin);
  });
}
document.getElementById('skin-toggle').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-skin]'); if (b) setSkin(b.getAttribute('data-skin'));
});
document.getElementById('mode-dial').addEventListener('click', function (e) {
  var sp = e.target.closest('span[data-skin]'); if (sp) setSkin(sp.getAttribute('data-skin'));
});
var motionBtn = document.getElementById('motion-toggle');
function setMotion(m) {
  root.setAttribute('data-motion', m);
  motionBtn.textContent = 'motion: ' + (m === 'reduced' ? 'reduced' : 'full');
}
motionBtn.addEventListener('click', function () {
  setMotion(root.getAttribute('data-motion') === 'reduced' ? 'full' : 'reduced');
});
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) setMotion('reduced');

/* ==================================================================
   11. bridge sky — seeded so it is identical on every load
   ================================================================== */
(function () {
  var rnd = rngFor('orbital-sky');
  function field(count, w, h, maxSize) {
    var out = [];
    for (var i = 0; i < count; i++) {
      out.push(Math.round(rnd() * w) + 'px ' + Math.round(rnd() * h) + 'px 0 ' +
        (rnd() * maxSize).toFixed(1) + 'px color-mix(in srgb, var(--star) ' +
        Math.round(35 + rnd() * 60) + '%, transparent)');
    }
    return out.join(',');
  }
  var w = Math.max(window.innerWidth, 1600) * 1.2, h = Math.max(window.innerHeight, 1000) * 1.2;
  document.getElementById('stars-far').style.boxShadow = field(200, w, h, .6);
  document.getElementById('stars-near').style.boxShadow = field(64, w, h, 1.1);
})();

/* ==================================================================
   12. boot
   ================================================================== */
layers[0].innerHTML = renderLevel('');
layers[0].classList.add('live');
syncChrome();

/* expose a tiny hook so the screenshot pass can jump straight to a depth */
window.orbitalMapGoTo = function (path) {
  var prev = root.getAttribute('data-motion');
  setMotion('reduced');
  goTo(path, null);
  setMotion(prev);
};

})();
</script>
